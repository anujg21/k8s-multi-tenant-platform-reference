apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-service
  # namespace is set implicitly by the ApplicationSet's destination
  # (team-a), provisioned ahead of time by terraform/modules/tenancy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-service
  template:
    metadata:
      labels:
        app: sample-service
    spec:
      containers:
        - name: sample-service
          image: public.ecr.aws/nginx/nginx:latest
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
