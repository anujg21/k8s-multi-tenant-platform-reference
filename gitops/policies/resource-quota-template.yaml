# Reference copy of the per-team ResourceQuota shape. In practice this is
# generated by terraform/modules/tenancy (see kubernetes_resource_quota
# there) rather than hand-written per team — kept here as a readable,
# standalone reference for what each tenant namespace ends up with.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: TEAM_NAME-quota
  namespace: TEAM_NAME
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    pods: "100"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: TEAM_NAME-default-limits
  namespace: TEAM_NAME
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
