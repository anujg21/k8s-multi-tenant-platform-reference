# Reference copy of the per-team tenancy shape. In practice this is
# generated by terraform/modules/tenancy (see kubernetes_namespace,
# kubernetes_resource_quota, kubernetes_network_policy there) rather than
# hand-written per team — kept here as a readable, standalone reference for
# what each tenant namespace ends up with. See docs/security-review.md for
# why the PSA labels and egress policies below exist.
apiVersion: v1
kind: Namespace
metadata:
  name: TEAM_NAME
  labels:
    platform.internal/tenant: TEAM_NAME
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: TEAM_NAME-quota
  namespace: TEAM_NAME
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    pods: "100"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: TEAM_NAME-default-limits
  namespace: TEAM_NAME
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
---
# Ingress: default-deny, then allow only same-tenant traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: TEAM_NAME
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: TEAM_NAME
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              platform.internal/tenant: TEAM_NAME
---
# Egress: default-deny, then allow only DNS and same-tenant traffic. Without
# this, ingress-side isolation stops other tenants reaching in, but nothing
# stops a compromised pod here reaching out (data exfiltration, IMDS, other
# tenants' egress-reachable services).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: TEAM_NAME
spec:
  podSelector: {}
  policyTypes: ["Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: TEAM_NAME
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace-egress
  namespace: TEAM_NAME
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              platform.internal/tenant: TEAM_NAME
